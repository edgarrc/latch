<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Setup - {{ app_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='app.css') }}" rel="stylesheet">
  </head>
  <body class="app-body auth-page min-vh-100 d-flex flex-column">
    <main class="container flex-grow-1 d-flex align-items-center justify-content-center py-4">
      <section class="auth-card">
        <div class="auth-brand">
          <span class="app-brand-mark" aria-hidden="true">L</span>
          <div>
            <div class="auth-title">{{ app_name }}</div>
            <p class="auth-copy">{{ app_tagline }}</p>
          </div>
        </div>
        <h1 class="h4 mb-2">Setup inicial</h1>
        <p class="text-secondary mb-4">Defina as senhas dos usuários admin e user para proteger a operação do Latch.</p>

        {% if error %}
          <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}

        <form method="post" action="/setup">
          <div class="mb-3">
            <label class="form-label" for="adminPassword">Senha do admin</label>
            <input id="adminPassword" class="form-control" name="admin_password" type="password" autocomplete="new-password" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="adminPasswordConfirm">Confirmar senha do admin</label>
            <input id="adminPasswordConfirm" class="form-control" name="admin_password_confirm" type="password" autocomplete="new-password" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="userPassword">Senha do user</label>
            <input id="userPassword" class="form-control" name="user_password" type="password" autocomplete="new-password" required>
          </div>
          <div class="mb-4">
            <label class="form-label" for="userPasswordConfirm">Confirmar senha do user</label>
            <input id="userPasswordConfirm" class="form-control" name="user_password_confirm" type="password" autocomplete="new-password" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Salvar senhas</button>
        </form>
      </section>
    </main>
    {% include "_app_footer.html" %}
  </body>
</html>
