<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ module.name }} - Gerenciador Batch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      .console {
        background: #111827;
        border-radius: 8px;
        color: #e5e7eb;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        height: 420px;
        overflow: auto;
        padding: 1rem;
        white-space: pre-wrap;
      }

      .log-error { color: #fca5a5; }
      .log-success { color: #86efac; }
      .log-info { color: #93c5fd; }
      .log-output { color: #e5e7eb; }

      .plugin-status {
        min-width: 7.5rem;
      }
    </style>
  </head>
  <body class="bg-body-tertiary">
    <main class="container py-4">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
        <div>
          <a class="link-secondary text-decoration-none" href="/">← Módulos</a>
          <h1 class="h3 mt-2 mb-0">{{ module.name }}</h1>
        </div>
        <div class="d-flex gap-2">
          <button id="clearButton" class="btn btn-outline-secondary" type="button" {% if module.running %}disabled{% endif %}>Clear</button>
          <button id="killButton" class="btn btn-danger" type="button" {% if not module.running %}disabled{% endif %}>Kill</button>
          <button id="runButton" class="btn btn-primary" type="button" {% if module.running %}disabled{% endif %}>
            {% if module.running %}Executando...{% else %}Executar Batch{% endif %}
          </button>
        </div>
      </div>

      <section class="mb-4">
        <h2 class="h5">Plugins configurados</h2>
        <div class="table-responsive">
          <table class="table table-sm align-middle bg-white">
            <thead>
              <tr>
                <th scope="col" class="text-secondary fw-semibold">#</th>
                <th scope="col" class="text-secondary fw-semibold">Etapa</th>
                <th scope="col" class="text-secondary fw-semibold">Tipo</th>
                <th scope="col" class="text-secondary fw-semibold text-end">Status</th>
              </tr>
            </thead>
            <tbody>
              {% for plugin in module.plugins %}
                <tr>
                  <td class="text-secondary">{{ loop.index }}</td>
                  <td class="fw-semibold">{{ plugin.id }}</td>
                  <td class="text-secondary small">{{ plugin.type }}</td>
                  <td class="text-end">
                    <span
                      class="badge plugin-status text-bg-secondary"
                      data-plugin-id="{{ plugin.id }}"
                    >Não iniciado</span>
                  </td>
                </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </section>

      <section>
        <div class="d-flex align-items-center justify-content-between mb-2">
          <h2 class="h5 mb-0">Console</h2>
          <span id="statusBadge" class="badge {% if module.running %}text-bg-primary{% else %}text-bg-secondary{% endif %}">
            {% if module.running %}Executando{% else %}Pronto{% endif %}
          </span>
        </div>
        <div id="console" class="console" aria-live="polite"></div>
      </section>
    </main>

    <script>
      const runButton = document.getElementById("runButton");
      const clearButton = document.getElementById("clearButton");
      const killButton = document.getElementById("killButton");
      const consoleEl = document.getElementById("console");
      const statusBadge = document.getElementById("statusBadge");
      const pluginIds = {{ module.plugins | map(attribute="id") | list | tojson }};
      const pluginStatusBadges = new Map(
        Array.from(document.querySelectorAll(".plugin-status")).map((badge) => [
          badge.dataset.pluginId,
          badge,
        ])
      );
      const pluginStatusConfig = {
        not_started: { label: "Não iniciado", className: "text-bg-secondary" },
        enqueued: { label: "Enfileirado", className: "text-bg-warning" },
        running: { label: "Executando", className: "text-bg-primary" },
        success: { label: "Concluído", className: "text-bg-success" },
        failed: { label: "Falhou", className: "text-bg-danger" },
        killed: { label: "Interrompido", className: "text-bg-danger" },
      };
      let eventSource = null;
      let lastLogSequence = 0;
      let currentLogRunId = "";
      let renderedLogKeys = new Set();
      let logRequestEpoch = 0;
      let waitingForNewRun = false;
      let lastTerminalStatus = "";
      let killRequested = false;

      function setPluginStatus(pluginId, status) {
        const badge = pluginStatusBadges.get(pluginId);
        const config = pluginStatusConfig[status];
        if (!badge || !config) {
          return;
        }

        badge.className = `badge plugin-status ${config.className}`;
        badge.textContent = config.label;
      }

      function setAllPluginStatuses(status) {
        for (const pluginId of pluginIds) {
          setPluginStatus(pluginId, status);
        }
      }

      function applyPluginStatuses(statuses) {
        if (!statuses || typeof statuses !== "object") {
          return false;
        }

        for (const [pluginId, status] of Object.entries(statuses)) {
          setPluginStatus(pluginId, status);
        }
        return true;
      }

      function updatePluginStatusesFromEvent(payload) {
        if (applyPluginStatuses(payload.plugin_statuses)) {
          return;
        }

        if (payload.event === "status") {
          setAllPluginStatuses("enqueued");
        } else if (payload.event === "plugin_start" && payload.plugin) {
          setPluginStatus(payload.plugin, "running");
        } else if (payload.event === "plugin_done" && payload.plugin) {
          setPluginStatus(payload.plugin, "success");
        } else if (payload.event === "done" && payload.plugin) {
          if (payload.status === "failed") {
            setPluginStatus(payload.plugin, "failed");
          } else if (payload.status === "killed") {
            setPluginStatus(payload.plugin, "killed");
          }
        }
      }

      function appendLog(payload) {
        if (payload.run_id && Number.isInteger(payload.sequence)) {
          const key = `${payload.run_id}:${payload.sequence}`;
          if (renderedLogKeys.has(key)) {
            return;
          }
          renderedLogKeys.add(key);
          currentLogRunId = payload.run_id;
        }

        updatePluginStatusesFromEvent(payload);

        const line = document.createElement("div");
        const prefix = payload.plugin ? `[${payload.plugin}] ` : "";
        line.className = `log-${payload.level || "output"}`;
        const time = payload.created_at ? new Date(payload.created_at).toLocaleTimeString() : new Date().toLocaleTimeString();
        line.textContent = `${time} ${prefix}${payload.message}`;
        consoleEl.appendChild(line);
        consoleEl.scrollTop = consoleEl.scrollHeight;

        if (Number.isInteger(payload.sequence)) {
          lastLogSequence = Math.max(lastLogSequence, payload.sequence);
        }
      }

      function resetConsole(runId = "") {
        consoleEl.textContent = "";
        lastLogSequence = 0;
        currentLogRunId = runId;
        renderedLogKeys = new Set();
        logRequestEpoch += 1;
        setAllPluginStatuses("not_started");
      }

      function setStatus(text, className) {
        statusBadge.className = `badge ${className}`;
        statusBadge.textContent = text;
      }

      function setRunningState(running) {
        if (running) {
          runButton.disabled = true;
          clearButton.disabled = true;
          killButton.disabled = killRequested;
          runButton.textContent = "Executando...";
          if (killRequested) {
            setStatus("Interrompendo", "text-bg-danger");
          } else {
            setStatus("Executando", "text-bg-primary");
          }
        } else {
          killRequested = false;
          runButton.disabled = false;
          clearButton.disabled = false;
          killButton.disabled = true;
          runButton.textContent = "Executar Batch";
          if (lastTerminalStatus === "success") {
            setStatus("Concluído", "text-bg-success");
          } else if (lastTerminalStatus === "killed") {
            setStatus("Interrompido", "text-bg-danger");
          } else if (lastTerminalStatus === "failed") {
            setStatus("Falhou", "text-bg-danger");
          } else {
            setStatus("Pronto", "text-bg-secondary");
          }
        }
      }

      async function refreshModuleStatus() {
        if (eventSource) {
          return;
        }

        try {
          const response = await fetch("/api/modules/{{ module.id }}/status", { cache: "no-store" });
          if (!response.ok) {
            return;
          }

          const payload = await response.json();
          setRunningState(payload.running);
        } catch (_error) {
          return;
        }
      }

      async function refreshModuleLogs() {
        if (waitingForNewRun) {
          return;
        }

        const requestEpoch = logRequestEpoch;
        const params = new URLSearchParams({ since: String(lastLogSequence) });
        if (currentLogRunId) {
          params.set("run_id", currentLogRunId);
        }

        try {
          const response = await fetch(`/api/modules/{{ module.id }}/logs?${params.toString()}`, { cache: "no-store" });
          if (!response.ok) {
            return;
          }

          const payload = await response.json();
          if (requestEpoch !== logRequestEpoch) {
            return;
          }

          if (payload.reset) {
            resetConsole(payload.run_id || "");
          }

          for (const event of payload.events) {
            appendLog(event);
            if (event.event === "done") {
              lastTerminalStatus = event.status || "";
            }
          }

          lastLogSequence = Math.max(lastLogSequence, payload.latest_sequence || 0);
          setRunningState(payload.running);
        } catch (_error) {
          return;
        }
      }

      runButton.addEventListener("click", () => {
        if (eventSource) {
          eventSource.close();
        }

        resetConsole();
        lastTerminalStatus = "";
        killRequested = false;
        waitingForNewRun = true;
        window.setTimeout(() => {
          waitingForNewRun = false;
          refreshModuleLogs();
        }, 500);

        runButton.disabled = true;
        clearButton.disabled = true;
        killButton.disabled = false;
        runButton.textContent = "Executando...";
        setStatus("Executando", "text-bg-primary");
        eventSource = new EventSource(`/api/modules/{{ module.id }}/run?t=${Date.now()}`);

        for (const eventName of ["status", "plugin_start", "log", "plugin_done"]) {
          eventSource.addEventListener(eventName, (event) => {
            waitingForNewRun = false;
            appendLog(JSON.parse(event.data));
          });
        }

        eventSource.addEventListener("done", (event) => {
          const payload = JSON.parse(event.data);
          waitingForNewRun = false;
          appendLog(payload);
          lastTerminalStatus = payload.status || "";
          killRequested = false;
          eventSource.close();
          eventSource = null;

          if (payload.status === "success") {
            runButton.disabled = false;
            clearButton.disabled = false;
            killButton.disabled = true;
            runButton.textContent = "Executar Batch";
            setStatus("Concluído", "text-bg-success");
          } else if (payload.status === "locked") {
            resetConsole();
            setRunningState(true);
            refreshModuleLogs();
          } else if (payload.status === "killed") {
            runButton.disabled = false;
            clearButton.disabled = false;
            killButton.disabled = true;
            runButton.textContent = "Executar Batch";
            setStatus("Interrompido", "text-bg-danger");
          } else {
            runButton.disabled = false;
            clearButton.disabled = false;
            killButton.disabled = true;
            runButton.textContent = "Executar Batch";
            setStatus("Falhou", "text-bg-danger");
          }
        });

        eventSource.onerror = () => {
          waitingForNewRun = false;
          killRequested = false;
          appendLog({ level: "error", message: "Conexão de log interrompida." });
          eventSource.close();
          eventSource = null;
          runButton.disabled = false;
          clearButton.disabled = false;
          killButton.disabled = true;
          runButton.textContent = "Executar Batch";
          setStatus("Erro", "text-bg-danger");
          refreshModuleLogs();
        };
      });

      clearButton.addEventListener("click", async () => {
        if (eventSource || clearButton.disabled) {
          return;
        }

        clearButton.disabled = true;

        try {
          const response = await fetch("/api/modules/{{ module.id }}/logs/clear", {
            method: "POST",
            cache: "no-store",
          });

          if (response.status === 409) {
            const payload = await response.json();
            appendLog({ level: "error", message: payload.message });
            setRunningState(true);
            refreshModuleLogs();
            return;
          }

          if (!response.ok) {
            appendLog({ level: "error", message: "Não foi possível limpar o log." });
            return;
          }

          resetConsole();
          lastTerminalStatus = "";
          setRunningState(false);
        } catch (_error) {
          appendLog({ level: "error", message: "Não foi possível limpar o log." });
        } finally {
          if (!eventSource) {
            clearButton.disabled = runButton.disabled;
          }
        }
      });

      killButton.addEventListener("click", async () => {
        if (killButton.disabled) {
          return;
        }

        killButton.disabled = true;
        killRequested = true;
        setStatus("Interrompendo", "text-bg-danger");

        try {
          const response = await fetch("/api/modules/{{ module.id }}/kill", {
            method: "POST",
            cache: "no-store",
          });

          if (!response.ok) {
            const payload = await response.json();
            appendLog({
              level: "error",
              message: payload.message || "Não foi possível interromper o módulo.",
            });
            killRequested = false;
            killButton.disabled = false;
            refreshModuleStatus();
            return;
          }

          refreshModuleLogs();
        } catch (_error) {
          killRequested = false;
          appendLog({ level: "error", message: "Não foi possível interromper o módulo." });
          killButton.disabled = false;
        }
      });

      refreshModuleLogs();
      setInterval(refreshModuleStatus, 2500);
      setInterval(refreshModuleLogs, 1000);
    </script>
  </body>
</html>
