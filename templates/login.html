<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - {{ app_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='app.css') }}" rel="stylesheet">
  </head>
  <body class="app-body auth-page min-vh-100 d-flex flex-column">
    <main class="container flex-grow-1 d-flex align-items-center justify-content-center py-4">
      <section class="auth-card">
        <div class="auth-brand">
          <span class="app-brand-mark" aria-hidden="true">L</span>
          <div>
            <div class="auth-title">{{ app_name }}</div>
            <p class="auth-copy">{{ app_tagline }}</p>
          </div>
        </div>
        <h1 class="h5 mb-2">Sign in</h1>
        <p class="text-secondary mb-4">Sign in to operate the available modules.</p>

        {% if error %}
          <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login">
          <input type="hidden" name="next" value="{{ next_url }}">
          <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input id="username" class="form-control" name="username" type="text" value="{{ username }}" autocomplete="username" required autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label" for="password">Password</label>
            <input id="password" class="form-control" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Sign in</button>
        </form>
      </section>
    </main>
    {% include "_app_footer.html" %}
  </body>
</html>
