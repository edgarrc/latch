<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Gerenciador Batch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-body-tertiary">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
      <section class="bg-white border rounded-2 p-4 w-100" style="max-width: 420px;">
        <h1 class="h4 mb-4">Entrar</h1>

        {% if error %}
          <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login">
          <input type="hidden" name="next" value="{{ next_url }}">
          <div class="mb-3">
            <label class="form-label" for="username">Usuário</label>
            <input id="username" class="form-control" name="username" type="text" value="{{ username }}" autocomplete="username" required autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label" for="password">Senha</label>
            <input id="password" class="form-control" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Entrar</button>
        </form>
      </section>
    </main>
  </body>
</html>
