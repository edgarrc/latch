name: TRI
description: Executa as etapas de preparação e processamento do batch TRI.
plugins:
  - id: preparar_tri
    type: command_line
    description: Prepara o ambiente do módulo TRI.
    command: "echo Preparando modulo TRI"
    error_contains: "ERROR"
    success_contains: "TRI"
  - id: processar_tri
    type: command_line
    description: Processa o batch TRI e valida a conclusão.
    command: "echo Batch TRI concluido"
    error_contains: "ERROR"
    success_contains: "concluido"
